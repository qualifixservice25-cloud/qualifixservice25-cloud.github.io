const CODICI = LINGUE.map(l => l[0]);

function linguaIniziale() {
  const daUrl = new URLSearchParams(location.search).get("lang");
  if (CODICI.includes(daUrl)) return daUrl;
  try {
    const salvata = localStorage.getItem("lingua");
    if (CODICI.includes(salvata)) return salvata;
  } catch (e) {}
  for (const l of (navigator.languages || [navigator.language || ""])) {
    const c = (l || "").slice(0, 2).toLowerCase();
    if (CODICI.includes(c)) return c;
  }
  return "en";
}

function applica(codice) {
  const t = TESTI[codice];
  document.documentElement.lang = codice;
  document.documentElement.dir = codice === "ar" ? "rtl" : "ltr";
  document.title = t.title;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll("[data-l]").forEach(ul => {
    ul.innerHTML = "";
    t[ul.dataset.l].forEach(testo => {
      const li = document.createElement("li");
      li.textContent = testo;
      ul.appendChild(li);
    });
  });
  document.getElementById("sceltaLingua").value = codice;
  document.getElementById("linkHome").href = "index.html?lang=" + codice;
  try { localStorage.setItem("lingua", codice); } catch (e) {}
}

const scelta = document.getElementById("sceltaLingua");
LINGUE.forEach(([codice, nome]) => {
  const o = document.createElement("option");
  o.value = codice; o.textContent = nome;
  scelta.appendChild(o);
});
scelta.addEventListener("change", () => {
  applica(scelta.value);
  const url = new URL(location.href);
  url.searchParams.set("lang", scelta.value);
  history.replaceState(null, "", url);
});
applica(linguaIniziale());
</script>
