<style>
@font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url('font/inter-400.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; font-display: swap; src: url('font/inter-600.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 700; font-display: swap; src: url('font/inter-700.woff2') format('woff2'); }
@font-face { font-family: 'Inter Display'; font-weight: 800; font-display: swap; src: url('font/inter-display-800.woff2') format('woff2'); }
@font-face { font-family: 'Inter Display'; font-weight: 900; font-display: swap; src: url('font/inter-display-900.woff2') format('woff2'); }

:root {
  --notte-0: #0b1219;
  --notte-1: #111922;
  --notte-2: #16212c;
  --notte-3: #1c2b3a;
  --arancio: #e67e22;
  --arancio-chiaro: #f39237;
  --arancio-testo: #b85a0c;
  --acciaio-chiaro: #4a90d9;
  --carta: #f3f6f9;
  --bianco: #ffffff;
  --inchiostro: #1f2d3a;
  --grigio: #56677a;
  --linea: #e1e7ed;
  --su-scuro-2: #a9bccd;
  --raggio: 18px;
  --ombra: 0 12px 32px rgba(17, 25, 34, .08);
  --titoli: 'Inter Display', 'Inter', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font: 400 17px/1.6 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: var(--inchiostro);
  background: var(--carta);
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; height: auto; }
a { color: var(--arancio-testo); }
a:focus-visible, button:focus-visible, select:focus-visible {
  outline: 3px solid var(--acciaio-chiaro); outline-offset: 3px; border-radius: 6px;
}
.contenitore { width: min(1160px, 100% - 32px); margin-inline: auto; }

.testata {
  background: var(--notte-1);
  color: #fff;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.testata .contenitore {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 64px;
}
.marchio { color: #fff; text-decoration: none; font: 800 1.15rem/1 var(--titoli); letter-spacing: -.01em; }
.marchio b { color: var(--arancio-chiaro); font-weight: 800; }
.lingua {
  font: 600 .9rem 'Inter', sans-serif; color: #fff; background: var(--notte-3);
  border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 8px 10px;
}

.apertura {
  position: relative; overflow: hidden;
  background: radial-gradient(1200px 500px at 85% -10%, rgba(230,126,34,.22), transparent 60%),
              linear-gradient(180deg, var(--notte-1), var(--notte-0));
  color: #fff;
  padding: clamp(56px, 9vw, 104px) 0 clamp(88px, 12vw, 140px);
}
.apertura h1 {
  margin: 0 0 18px;
  font: 900 clamp(2.3rem, 6vw, 4rem)/1.02 var(--titoli);
  letter-spacing: -.03em; max-width: 14ch; text-wrap: balance;
}
.apertura h1 span { color: var(--arancio-chiaro); }
.apertura p { margin: 0; max-width: 56ch; color: var(--su-scuro-2); font-size: 1.12rem; text-wrap: pretty; }

.app-griglia {
  list-style: none; margin: -64px auto 0; padding: 0;
  display: grid; gap: 20px;
  grid-template-columns: 1fr;
  position: relative;
}
.app {
  display: flex; flex-direction: column; gap: 14px;
  background: var(--bianco); border: 1px solid var(--linea); border-radius: var(--raggio);
  box-shadow: var(--ombra); padding: 24px;
}
@media (min-width: 760px) { .app-griglia { grid-template-columns: repeat(2, 1fr); } }
.app-capo { display: flex; align-items: center; gap: 14px; }
.app-capo img, .app-capo svg { width: 64px; height: 64px; border-radius: 16px; flex: none; }
.app h2 { margin: 0; font: 800 1.3rem/1.15 var(--titoli); letter-spacing: -.01em; }
.app .stato { display: inline-block; margin-top: 4px; font-size: .78rem; font-weight: 700; color: var(--grigio); text-transform: uppercase; letter-spacing: .06em; }
.app .stato.arrivo { color: var(--arancio-testo); }
.app p { margin: 0; color: var(--grigio); flex: 1; }
.app-azioni { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pulsante {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 11px 18px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: .95rem;
  background: var(--arancio); color: #fff;
}
.pulsante:hover { background: var(--arancio-testo); }
.pulsante.secondario { background: var(--carta); color: var(--inchiostro); border: 1px solid var(--linea); }
.pulsante.secondario:hover { background: var(--linea); }
.app-link { display: flex; gap: 16px; font-size: .9rem; }
.app-link a { color: var(--grigio); }

.chi {
  padding: clamp(56px, 8vw, 96px) 0;
}
.chi .contenitore { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.chi h3 { margin: 0 0 6px; font: 800 1.1rem/1.2 var(--titoli); }
.chi p { margin: 0; color: var(--grigio); }

.piede { background: var(--notte-1); color: var(--su-scuro-2); padding: 28px 0; font-size: .92rem; }
.piede .contenitore { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; }
.piede a { color: #fff; }
.piede nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
</style>
</head>
<body>

<header class="testata">
  <div class="contenitore">
    <a class="marchio" href="./">Qualifix <b>Service</b></a>
    <select class="lingua" id="lingua" aria-label="Lingua / Language">
      <option value="it">Italiano</option>
      <option value="en">English</option>
    </select>
  </div>
</header>

<main id="contenuto">
  <section class="apertura">
    <div class="contenitore">
      <h1 data-t="titolo"></h1>
      <p data-t="sottotitolo"></p>
    </div>
  </section>

  <ul class="app-griglia contenitore">
    <li class="app">
      <div class="app-capo">
        <img src="img/calcolo-cartongesso.webp" width="64" height="64" alt="">
        <div><h2>Calcolo Cartongesso</h2><span class="stato" data-t="suPlay"></span></div>
      </div>
      <p data-t="cartongesso"></p>
      <div class="app-azioni">
        <a class="pulsante" href="https://play.google.com/store/apps/details?id=org.qualifix.service.calcolocartongesso" data-t="scarica"></a>
        <a class="pulsante secondario" href="calcolo-cartongesso/" data-t="scopri"></a>
      </div>
      <div class="app-link"><a href="calcolo-cartongesso/privacy-policy.html" data-t="privacy"></a></div>
    </li>
    <li class="app">
      <div class="app-capo">
        <img src="img/ottimizza-tagli.webp" width="64" height="64" alt="">
        <div><h2>Ottimizza Tagli</h2><span class="stato" data-t="suPlay"></span></div>
      </div>
      <p data-t="tagli"></p>
      <div class="app-azioni">
        <a class="pulsante" href="https://play.google.com/store/apps/details?id=org.qualifix.service.ottimizza_tagli" data-t="scarica"></a>
        <a class="pulsante secondario" href="ottimizza-tagli/" data-t="scopri"></a>
      </div>
      <div class="app-link"><a href="ottimizza-tagli/privacy-policy.html" data-t="privacy"></a></div>
    </li>
    <li class="app">
      <div class="app-capo">
        <img src="img/guida-filettature.webp" width="64" height="64" alt="">
        <div><h2>Guida Filettature</h2><span class="stato" data-t="suPlay"></span></div>
      </div>
      <p data-t="filettature"></p>
      <div class="app-azioni">
        <a class="pulsante" href="https://play.google.com/store/apps/details?id=org.qualifix.service.guida_filettature" data-t="scarica"></a>
        <a class="pulsante secondario" href="guida-filettature/" data-t="scopri"></a>
      </div>
      <div class="app-link"><a href="guida-filettature/privacy-policy.html" data-t="privacy"></a></div>
    </li>
    <li class="app">
      <div class="app-capo">
        <!-- Icona provvisoria: sostituire con img/sviluppo-lamiera.webp quando c'è l'icona dell'app -->
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#2c3e50"/>
          <path d="M12 44 H30 L44 22 H52" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M33 42 a8 8 0 0 0 4 -9" fill="none" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div><h2>Sviluppo Lamiera</h2><span class="stato arrivo" data-t="inArrivo"></span></div>
      </div>
      <p data-t="lamiera"></p>
      <div class="app-azioni">
        <!-- Quando l'app è su Google Play: <a class="pulsante" href="https://play.google.com/store/apps/details?id=org.qualifix.service.sviluppolamiera" data-t="scarica"></a> -->
        <a class="pulsante" href="sviluppo-lamiera/" data-t="scopri"></a>
      </div>
      <div class="app-link"><a href="sviluppo-lamiera/privacy-policy.html" data-t="privacy"></a></div>
    </li>
  </ul>

  <section class="chi">
    <div class="contenitore">
      <div><h3 data-t="p1t"></h3><p data-t="p1"></p></div>
      <div><h3 data-t="p2t"></h3><p data-t="p2"></p></div>
      <div><h3 data-t="p3t"></h3><p data-t="p3"></p></div>
    </div>
  </section>
</main>

<footer class="piede">
  <div class="contenitore">
    <p>© 2026 Qualifix Service</p>
    <nav>
      <a href="mailto:qualifix.service25@gmail.com" data-t="contatti"></a>
    </nav>
  </div>
</footer>

<script>
const TESTI = {
  it: {
    titolo: "App per il <span>cantiere</span> e l'<span>officina</span>",
    sottotitolo: "Strumenti pratici per Android, pensati da chi lavora: calcoli dei materiali, schemi di taglio, filettature e piegatura della lamiera.",
    suPlay: "Su Google Play",
    inArrivo: "In arrivo su Google Play",
    scarica: "Scarica",
    scopri: "Scopri l'app",
    privacy: "Privacy policy",
    cartongesso: "Materiali per controsoffitti, tramezze, contropareti e velette, computo e Progetto 3D della stanza. In 10 lingue.",
    tagli: "Lo schema di taglio per barre e profili con meno sfrido: avanzi di magazzino, costi, taglio a gradi e PDF per l'officina.",
    filettature: "483 filettature in 13 famiglie con disegno quotato, preforo, maschiatura, filiera e una sezione Bulloneria completa. Offline.",
    lamiera: "Fattore K secondo DIN 6935, sviluppo della lamiera, lato minimo piegabile e sequenza delle pieghe alla pressa piegatrice.",
    p1t: "Fatte per chi lavora",
    p1: "Numeri che servono in cantiere e in officina, con disegni chiari e senza giri inutili.",
    p2t: "Funzionano offline",
    p2: "I calcoli si fanno sul telefono: niente account e niente rete per usarle.",
    p3t: "Contatti",
    p3: "Domande, errori o idee per una nuova funzione? Scrivi a qualifix.service25@gmail.com.",
    contatti: "Contatti"
  },
  en: {
    titolo: "Apps for the <span>job site</span> and the <span>workshop</span>",
    sottotitolo: "Practical Android tools made by people who do the work: material estimates, cutting plans, threads and sheet metal bending.",
    suPlay: "On Google Play",
    inArrivo: "Coming soon to Google Play",
    scarica: "Download",
    scopri: "Learn more",
    privacy: "Privacy policy",
    cartongesso: "Drywall materials for ceilings, partitions, wall linings and bulkheads, bill of quantities and 3D room project. In 10 languages.",
    tagli: "Cutting plans for bars and profiles with less waste: stock offcuts, costs, mitre cuts and a PDF for the workshop. (Italian)",
    filettature: "483 threads in 13 families with dimensioned drawings, tap drill, tapping, die cutting and a full fasteners section. Offline. (Italian)",
    lamiera: "K-factor according to DIN 6935, flat pattern length, minimum flange and bending sequence on the press brake. (Italian)",
    p1t: "Made for the trade",
    p1: "The numbers you need on site and in the workshop, with clear drawings and no detours.",
    p2t: "Work offline",
    p2: "Everything is calculated on the phone: no account and no connection needed.",
    p3t: "Contact",
    p3: "Questions, bugs or ideas for a new feature? Write to qualifix.service25@gmail.com.",
    contatti: "Contact"
  }
};
function lingua(codice) {
  const t = TESTI[codice] || TESTI.it;
  document.documentElement.lang = codice;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.getElementById("lingua").value = codice;
  document.querySelectorAll('a[href$="privacy-policy.html"], a[href*="privacy-policy.html?"]').forEach(a => {
    if (a.closest(".app")) a.href = a.getAttribute("href").split("?")[0] + (codice === "it" ? "" : "?lang=" + codice);
  });
}
const parametro = new URLSearchParams(location.search).get("lang");
const iniziale = parametro && TESTI[parametro] ? parametro
  : ((navigator.language || "it").slice(0, 2) === "it" ? "it" : "en");
lingua(iniziale);
document.getElementById("lingua").addEventListener("change", e => {
  lingua(e.target.value);
  const u = new URL(location.href); u.searchParams.set("lang", e.target.value); history.replaceState(null, "", u);
});
</script>
</body>
</html>
