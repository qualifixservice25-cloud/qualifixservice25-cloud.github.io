function linguaIniziale() {
  const daUrl = new URLSearchParams(location.search).get("lang");
  if (CODICI.includes(daUrl)) return daUrl;
  try {
    const salvata = localStorage.getItem("lingua");
    if (CODICI.includes(salvata)) return salvata;
  } catch (e) {}
  for (const l of (navigator.languages || [navigator.language || ""])) {
    const c = (l || "").slice(0, 2).toLowerCase();
    if (CODICI.includes(c)) return c;
  }
  return "en";
}

function applica(codice) {
  const t = TESTI[codice];
  document.documentElement.lang = codice;
  document.documentElement.dir = codice === "ar" ? "rtl" : "ltr";
  document.title = t.title;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll("[data-l]").forEach(ul => {
    ul.innerHTML = "";
    t[ul.dataset.l].forEach(testo => {
      const li = document.createElement("li");
      li.textContent = testo;
      ul.appendChild(li);
    });
  });
  document.querySelectorAll("[data-badge]").forEach(img => {
    img.alt = t.badge_alt;
    img.onerror = () => { img.onerror = null; img.src = BADGE + "en_badge_web_generic.png"; };
    img.src = BADGE + codice + "_badge_web_generic.png";
  });
  document.querySelectorAll("[data-play]").forEach(a => { a.href = PLAY + "&hl=" + codice; });
  const galleria = document.getElementById("galleria");
  galleria.innerHTML = "";
  IMMAGINI.forEach((nome, i) => {
    const f = document.createElement("figure");
    const img = document.createElement("img");
    img.className = "phone"; img.loading = "lazy"; img.width = 540; img.height = 1080;
    img.src = "img/" + nome + ".webp"; img.alt = t.captions[i];
    const cap = document.createElement("figcaption");
    cap.textContent = t.captions[i];
    f.append(img, cap);
    galleria.appendChild(f);
  });
  document.querySelectorAll("#lingue a").forEach(a => a.classList.toggle("attiva", a.dataset.codice === codice));
  document.getElementById("sceltaLingua").value = codice;
  document.getElementById("linkPrivacy").href = "privacy-policy.html?lang=" + codice;
  try { localStorage.setItem("lingua", codice); } catch (e) {}
}

function cambia(codice) {
  applica(codice);
  const url = new URL(location.href);
  url.searchParams.set("lang", codice);
  history.replaceState(null, "", url);
}

const scelta = document.getElementById("sceltaLingua");
const elenco = document.getElementById("lingue");
LINGUE.forEach(([codice, nome]) => {
  const o = document.createElement("option");
  o.value = codice; o.textContent = nome;
  scelta.appendChild(o);
  const a = document.createElement("a");
  a.href = "?lang=" + codice; a.textContent = nome; a.dataset.codice = codice; a.lang = codice;
  a.addEventListener("click", e => { e.preventDefault(); cambia(codice); window.scrollTo({ top: 0, behavior: "smooth" }); });
  elenco.appendChild(a);
});
scelta.addEventListener("change", () => cambia(scelta.value));
applica(linguaIniziale());
</script>
</body>
</html>
