const TUTTE_LE_APP = {"it": "Tutte le app", "en": "All apps", "de": "Alle Apps", "es": "Todas las apps", "fr": "Toutes les apps", "nl": "Alle apps", "ro": "Toate aplicațiile", "sq": "Të gjitha aplikacionet", "ru": "Все приложения", "ar": "كل التطبيقات"};
const CODICI = LINGUE.map(l => l[0]);
const PLAY = "https://play.google.com/store/apps/details?id=org.qualifix.service.calcolocartongesso";
const BADGE = "https://play.google.com/intl/en_us/badges/static/images/badges/";

function linguaIniziale() {
  const p = new URLSearchParams(location.search).get("lang");
  if (p && CODICI.includes(p)) return p;
  try { const s = localStorage.getItem("lingua"); if (s && CODICI.includes(s)) return s; } catch (e) {}
  const b = (navigator.language || "en").slice(0, 2).toLowerCase();
  return CODICI.includes(b) ? b : "en";
}

function applica(codice) {
  const t = TESTI[codice];
  const nome = NOMI[codice];
  // Il titolo con il nome dell'app nella lingua, come nella scheda dello store.
  const titolo = t.title.replace(/^Calcolo Cartongesso/, nome);
  document.documentElement.lang = codice;
  document.documentElement.dir = codice === "ar" ? "rtl" : "ltr";
  document.title = titolo;
  document.querySelector('meta[property="og:title"]').content = titolo;
  document.querySelector('meta[name="description"]').content = nome + ": " + t.hero;
  document.querySelectorAll("[data-nome]").forEach(el => { el.textContent = nome; });
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll("[data-p]").forEach(el => { el.innerHTML = PANNELLI[codice][el.dataset.p][0]; });
  document.querySelectorAll("[data-ps]").forEach(el => { el.textContent = PANNELLI[codice][el.dataset.ps][1]; });
  document.querySelectorAll("[data-l]").forEach(ul => {
    ul.innerHTML = "";
    t[ul.dataset.l].forEach(testo => {
      const li = document.createElement("li");
      li.innerHTML = '<svg class="icona"><use href="#i-spunta"/></svg>';
      const s = document.createElement("span");
      s.textContent = testo;
      li.appendChild(s);
      ul.appendChild(li);
    });
  });
  // Le schermate dell'app nella lingua scelta.
  document.querySelectorAll("[data-img]").forEach(img => {
    img.src = "img/" + codice + "/telefono-" + img.dataset.img + ".webp";
    img.alt = nome;
  });
  document.querySelectorAll("[data-badge]").forEach(img => {
    img.alt = t.badge_alt;
    img.onerror = () => { img.onerror = null; img.src = BADGE + "en_badge_web_generic.png"; };
    img.src = BADGE + codice + "_badge_web_generic.png";
  });
  document.querySelectorAll("[data-play]").forEach(a => { a.href = PLAY + "&hl=" + codice; });
  document.querySelectorAll("#elencoLingue li").forEach(li => li.classList.toggle("attiva", li.dataset.codice === codice));
  document.getElementById("sceltaLingua").value = codice;
  document.getElementById("linkTutte").textContent = TUTTE_LE_APP[codice];
  document.getElementById("linkPrivacy").href = "privacy-policy.html?lang=" + codice;
  try { localStorage.setItem("lingua", codice); } catch (e) {}
}

function cambia(codice) {
  applica(codice);
  const url = new URL(location.href);
  url.searchParams.set("lang", codice);
  history.replaceState(null, "", url);
}

const scelta = document.getElementById("sceltaLingua");
const elenco = document.getElementById("elencoLingue");
LINGUE.forEach(([codice, nome]) => {
  const o = document.createElement("option");
  o.value = codice; o.textContent = nome;
  scelta.appendChild(o);
  const li = document.createElement("li");
  li.dataset.codice = codice;
  const a = document.createElement("a");
  a.href = "?lang=" + codice; a.textContent = nome; a.lang = codice;
  a.addEventListener("click", e => { e.preventDefault(); cambia(codice); window.scrollTo({ top: 0, behavior: "smooth" }); });
  li.appendChild(a);
  elenco.appendChild(li);
});
scelta.addEventListener("change", () => cambia(scelta.value));
applica(linguaIniziale());
</script>
