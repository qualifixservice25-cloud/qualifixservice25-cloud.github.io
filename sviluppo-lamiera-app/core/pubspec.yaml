name: sviluppo_lamiera_core
description: >-
  Motore di calcolo per la piegatura della lamiera: fattore K, sviluppo,
  scelta della cava, lato minimo e sequenza di piega. Dart puro, nessuna
  dipendenza da Flutter, così i test girano senza SDK Android.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
