services:
  converter:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Senza questa chiave chiunque raggiunga il server puo' convertire file: impostala prima
      # di esporre la porta oltre la propria rete locale.
      CONVERTER_API_KEY: "${CONVERTER_API_KEY:-}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-200}"
      CONVERT_TIMEOUT_SECONDS: "${CONVERT_TIMEOUT_SECONDS:-120}"
      OUTPUT_VERSION: "${OUTPUT_VERSION:-ACAD2010}"
    restart: unless-stopped
